    <body>
        <p><a href="index.html">Go back!</a></p>
        <button id="tlačítko">

        <h1>Kostky:</h1>
        <form id="formKostka" method="get">
            <label for="strany">
                Vyberte počet stran kostky:
            </label>
            <input type="number" id="strany" name="strany"><br>
            <input type="submit" value="Submit">
        </form>



        <button id="kostka">Roll a dice</button><br>
        <p id="výsledek"></p>
        
        <script src="script.js"></script>
        <script>
            const form = document.getElementById("formKostka");

            form.addEventListener("submit", function(event){
                const formData = new FormData(form);
                const početStran = formData.get("strany");

                console.log(formData);
                console.log(početStran);

                form.reset();
            })

        </script>
